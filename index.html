<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日時チェック (schedule.txt 自動解析)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      background-color: #f5f5f7;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    input[type="file"] {
      width: 100%;
      font-size: 16px;
      margin-top: 10px;
    }
    textarea {
      width: 100%;
      height: 250px;
      font-size: 14px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      margin-top: 15px;
      background-color: #fafafa;
    }
    .status {
      font-weight: bold;
      color: #0066cc;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>📅 日時チェック (自動解析)</h2>
    <div id="statusMsg" class="status">schedule.txt を読み込み中...</div>
    
    <textarea id="filePreview" readonly placeholder="ファイルの中身がここに表示されます"></textarea>

    <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
    <p style="font-size: 12px; color: #666;">※手動で読み込み直す場合はこちら：</p>
    <input type="file" id="fileInput" accept=".txt">
  </div>

  <script>
    // ページロード時に schedule.txt を自動読み込み
    window.addEventListener('DOMContentLoaded', () => {
      loadScheduleTxt();
    });

    // schedule.txt を自動取得する関数 (ローカルファイル判定最適化版)
    function loadScheduleTxt() {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', 'schedule.txt?_=' + new Date().getTime(), true);

      xhr.onload = function() {
        // テキストの中身が存在すればステータスコードに関わらず成功とみなす
        if (xhr.responseText && xhr.responseText.length > 0) {
          document.getElementById('statusMsg').textContent = "✅ schedule.txt の自動読み込みに成功しました。";
          document.getElementById('filePreview').value = xhr.responseText;
          checkDates(xhr.responseText.split("\n"));
        } else {
          showError();
        }
      };

      xhr.onerror = function() {
        // file:// 直開きで onerror に入った場合でも、responseTextにデータがあれば処理する
        if (xhr.responseText && xhr.responseText.length > 0) {
          document.getElementById('statusMsg').textContent = "✅ schedule.txt の自動読み込みに成功しました。";
          document.getElementById('filePreview').value = xhr.responseText;
          checkDates(xhr.responseText.split("\n"));
        } else {
          showError();
        }
      };

      try {
        xhr.send();
      } catch (e) {
        showError();
      }
    }

    function showError() {
      document.getElementById('statusMsg').textContent = "⚠️ schedule.txt の自動取得に失敗しました。下の「ファイルの選択」から手動で指定してください。";
    }

    // 手動ファイル選択のイベント（予備）
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const content = e.target.result;
        document.getElementById('statusMsg').textContent = "✅ 手動ファイル読み込み完了";
        document.getElementById('filePreview').value = content;
        checkDates(content.split("\n"));
      };
      reader.readAsText(file);
    });

    // 日時判定ロジック
    function checkDates(lines) {
      const now = new Date();
      const currentYear = now.getFullYear();

      // 本日の開始(00:00:00)と終了(23:59:59)
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);

      // 木曜日開始（木曜日 00:00:00 〜 翌週水曜日 23:59:59）の範囲を設定
      const dayOfWeek = now.getDay(); // 0:日, 1:月, 2:火, 3:水, 4:木, 5:金, 6:土
      const diffToThursday = (dayOfWeek + 3) % 7; 

      const weekStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToThursday, 0, 0, 0);
      const weekEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate() - diffToThursday + 6, 23, 59, 59);

      let todayMatches = [];
      let weekMatches = [];

      for (let line of lines) {
        line = line.trim();
        // コメント行（//）や空行は無視
        if (!line || line.startsWith("//")) continue;

        // 行頭の「月/日 時:分」パターンを取り出す
        const match = line.match(/^(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/);
        if (match) {
          const month = parseInt(match[1]) - 1;
          const day = parseInt(match[2]);
          const hour = parseInt(match[3]);
          const minute = parseInt(match[4]);

          // 24時以降（25:00等）の深夜表記を正しい日付に自動換算してDate生成
          const targetDate = new Date(currentYear, month, day, 0, minute);
          targetDate.setHours(hour); 

          if (targetDate >= todayStart && targetDate <= todayEnd) {
            todayMatches.push(line);
          }
          if (targetDate >= weekStart && targetDate <= weekEnd) {
            weekMatches.push(line);
          }
        }
      }

      let resultMsg = "";
      if (todayMatches.length > 0) {
        resultMsg += "【本日】\n" + todayMatches.join("\n") + "\n\n";
      }
      if (weekMatches.length > 0) {
        resultMsg += "【今週（木〜水）】\n" + weekMatches.join("\n");
      }

      if (resultMsg !== "") {
        alert(resultMsg);
      } else {
        alert("本日・今週に該当する記載はありませんでした。");
      }
    }
  </script>
</body>
</html>
